[package]
name = "agent-workspace"
version = "1.5.9"
description = "Qivreno — a team of up to 12 autonomous AI agents"
authors = ["272 Solutions LLC"]
edition = "2021"

[lib]
name = "agent_workspace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
ureq = { version = "2", features = ["json"] }
tiny_http = "0.12"
ed25519-dalek = "2"
base64 = "0.22"
rust_xlsxwriter = "0.96.0"
docx-rs = "0.4.20"
zip = "8.6.0"
imap = "2.4"
native-tls = "0.2"
mailparse = "0.15"
tauri-plugin-global-shortcut = "2.3.2"

[profile.release]
strip = true
