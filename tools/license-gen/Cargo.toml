[package]
name = "license-gen"
version = "1.0.0"
description = "Qivreno license issuing CLI (272 Solutions internal tool)"
edition = "2021"

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
base64 = "0.22"
rand_core = { version = "0.6", features = ["std", "getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[[bin]]
name = "license-gen"
path = "src/main.rs"
