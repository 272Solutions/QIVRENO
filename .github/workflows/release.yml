# Builds signed installers for macOS (.dmg) and Windows (.exe NSIS installer
# + .msi) on every version tag (v*) or manual run. Push this repo to GitHub
# and the Windows build needs no Windows machine of your own.
#
# Secrets to add later (Settings → Secrets → Actions):
#   APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY
#   APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID          (macOS notarization)
#   WINDOWS_CERTIFICATE / WINDOWS_CERTIFICATE_PASSWORD (Windows code signing)
# Unsigned builds work without any secrets — fine for internal testing.

name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# The default GITHUB_TOKEN is read-only; creating the draft release needs write.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci || npm install

      - name: Prepare Apple API key (macOS, signed releases only)
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -n "$APPLE_API_KEY_P8" ]; then
            mkdir -p ~/.appleconnect
            echo "$APPLE_API_KEY_P8" | base64 --decode > ~/.appleconnect/AuthKey.p8
            echo "APPLE_API_KEY_PATH=$HOME/.appleconnect/AuthKey.p8" >> "$GITHUB_ENV"
          fi

      - name: Build app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS Developer ID signing + notarization (no-ops when secrets are
          # unset — the build stays unsigned, exactly as today).
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        with:
          args: ${{ matrix.args }}
          # On tag pushes, attach installers to a draft GitHub release:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('Qivreno {0}', github.ref_name) || '' }}
          releaseDraft: true

      - name: Upload artifacts (manual runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: qivreno-${{ matrix.platform }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi
          if-no-files-found: warn
