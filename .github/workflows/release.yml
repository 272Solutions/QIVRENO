# Builds signed installers for macOS (.dmg) and Windows (.exe NSIS installer
# + .msi) on every version tag (v*) or manual run. Push this repo to GitHub
# and the Windows build needs no Windows machine of your own.
#
# Secrets to add later (Settings → Secrets → Actions):
#   APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY
#   APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID          (macOS notarization)
# Windows signing via Azure Trusted Signing (all six required):
#   AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_CLIENT_SECRET
#     (an Entra app registration granted the "Trusted Signing Certificate
#      Profile Signer" role on the signing account)
#   AZURE_SIGNING_ENDPOINT  e.g. https://eus.codesigning.azure.net
#   AZURE_SIGNING_ACCOUNT   the Trusted Signing account name
#   AZURE_SIGNING_PROFILE   the certificate profile name
# Unsigned builds work without any secrets — fine for internal testing.

name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# The default GITHUB_TOKEN is read-only; creating the draft release needs write.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci || npm install

      # Tauri treats a PRESENT-but-empty APPLE_CERTIFICATE as "sign this build"
      # and dies at `security import`, so the signing vars must only exist in
      # the build step's environment when the secrets are actually configured.
      # We stage them through GITHUB_ENV (values stay masked in logs).
      - name: Enable Apple signing (macOS, only when secrets are set)
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "Apple signing secrets not configured — building unsigned."
            exit 0
          fi
          {
            echo "APPLE_CERTIFICATE<<__EOF__";          echo "$APPLE_CERTIFICATE";          echo "__EOF__"
            echo "APPLE_CERTIFICATE_PASSWORD<<__EOF__"; echo "$APPLE_CERTIFICATE_PASSWORD"; echo "__EOF__"
            echo "APPLE_SIGNING_IDENTITY<<__EOF__";     echo "$APPLE_SIGNING_IDENTITY";     echo "__EOF__"
            echo "APPLE_API_ISSUER<<__EOF__";           echo "$APPLE_API_ISSUER";           echo "__EOF__"
            echo "APPLE_API_KEY<<__EOF__";              echo "$APPLE_API_KEY";              echo "__EOF__"
          } >> "$GITHUB_ENV"
          if [ -n "$APPLE_API_KEY_P8" ]; then
            mkdir -p ~/.appleconnect
            echo "$APPLE_API_KEY_P8" | base64 --decode > ~/.appleconnect/AuthKey.p8
            echo "APPLE_API_KEY_PATH=$HOME/.appleconnect/AuthKey.p8" >> "$GITHUB_ENV"
          fi

      # Windows signing via Azure Trusted Signing. Tauri's bundler runs
      # bundle.windows.signCommand for the exe and each installer; we inject
      # that command only when the Azure secrets are configured, so unsigned
      # builds keep working with no secrets (same pattern as Apple above).
      - name: Enable Windows signing (Azure Trusted Signing, only when secrets are set)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
        run: |
          if (-not $env:AZURE_CLIENT_SECRET) {
            Write-Host "Azure Trusted Signing secrets not configured - building unsigned."
            exit 0
          }
          cargo install trusted-signing-cli --locked
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $sign = "trusted-signing-cli -e $env:AZURE_SIGNING_ENDPOINT -a $env:AZURE_SIGNING_ACCOUNT -c $env:AZURE_SIGNING_PROFILE %1"
          if (-not $conf.bundle.PSObject.Properties['windows']) {
            $conf.bundle | Add-Member -MemberType NoteProperty -Name windows -Value ([pscustomobject]@{})
          }
          $conf.bundle.windows | Add-Member -MemberType NoteProperty -Name signCommand -Value $sign -Force
          $conf | ConvertTo-Json -Depth 64 | Set-Content src-tauri/tauri.conf.json -Encoding utf8
          Write-Host "signCommand injected for Azure Trusted Signing."
          # The CLI authenticates with these at build time:
          "AZURE_TENANT_ID=$env:AZURE_TENANT_ID"         >> $env:GITHUB_ENV
          "AZURE_CLIENT_ID=$env:AZURE_CLIENT_ID"         >> $env:GITHUB_ENV
          "AZURE_CLIENT_SECRET=$env:AZURE_CLIENT_SECRET" >> $env:GITHUB_ENV

      # The vendored llama.cpp engine ships as prebuilt Mach-O files with no
      # signature. Tauri signs the .app but never re-signs nested binaries, so
      # notarization rejects them ("not signed with a valid Developer ID
      # certificate" / "signature does not include a secure timestamp").
      # Sign them inside-out before the bundle is assembled. Mirrors the same
      # step in sign-release.sh for local release builds.
      - name: Sign bundled engine binaries (macOS, only when signing is configured)
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "No signing identity configured - skipping (build will not be notarized)."
            exit 0
          fi
          dir=src-tauri/resources/llama
          [ -d "$dir" ] || { echo "no engine resources at $dir"; exit 0; }
          machos=()
          for f in "$dir"/*; do
            [ -f "$f" ] || continue
            file "$f" | grep -q "Mach-O" && machos+=("$f")
          done
          echo "Signing ${#machos[@]} engine binaries"
          # Libraries first, then executables, so each signature seals its deps.
          for f in "${machos[@]}"; do
            case "$f" in *.dylib) codesign --force --timestamp --options runtime \
              --sign "$APPLE_SIGNING_IDENTITY" "$f" ;; esac
          done
          for f in "${machos[@]}"; do
            case "$f" in *.dylib) ;; *) codesign --force --timestamp --options runtime \
              --sign "$APPLE_SIGNING_IDENTITY" "$f" ;; esac
          done
          # Fail here rather than after a 10-minute notarization round trip.
          for f in "${machos[@]}"; do
            codesign -dvv "$f" 2>&1 | grep -q "Timestamp=" || {
              echo "no secure timestamp on $f"; exit 1; }
          done
          echo "All engine binaries signed with secure timestamps."

      - name: Build app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          # On tag pushes, attach installers to a draft GitHub release:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('Qivreno {0}', github.ref_name) || '' }}
          releaseDraft: true

      - name: Upload artifacts (manual runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: qivreno-${{ matrix.platform }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi
          if-no-files-found: warn
